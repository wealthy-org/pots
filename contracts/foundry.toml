[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
  { access = "read", path = "./script" },
  { access = "write", path = "./deployments" },
]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32
fail_on_revert = false

[lint]
exclude_lints = [
  "block-timestamp",
  "environment-read-across-mutation",
  "incorrect-strict-equality",
  "reentrancy-events",
  "require-revert-in-loop",
  "unsafe-typecast",
]
